shape_name: ???
exp_name_s1: "synthetic_s1"
exp_name_s2: "synthetic_s2"
exp_name_s3: "synthetic_s3"
source_path: "data/nerf_synthetic/${shape_name}"
images: ???
data_device: "cuda"
white_background: true
eval: true
coarse_mesh_path: "output/${exp_name_s1}/${shape_name}/coarse_mesh.obj"
coarse_gs_path: "output/${exp_name_s1}/${shape_name}/chkpnt${s1_iterations}.pth"
s1_model_path: "output/${exp_name_s1}/${shape_name}"
s2_model_path: "output/${exp_name_s2}/${shape_name}"
s2a_model_path: "output/${exp_name_s2}/${shape_name}"
s3_model_path: "output/${exp_name_s3}/${shape_name}"
s1_iterations: 10000
s2_iterations: 10000
s3_iterations: 10000
batchsize: 1

# stage-1: create coarse mesh
densify_until_iter: 7000
alpha_shape: 0.1
watertight_res: 5000

# stage-2: create mesh for foreground
aabb_fg: null  # only foreground
gs_per_face: 3
res_fg: 100
c2f_steps: [1000, 3000, 5000, 7000]  # [1500, 3000, 4500, 6000]
c2f_rate: 1.5
adaptive_cov: true

sdf_lr: 0.005
deform_lr: 0.01
final_lr_rate: 0.01
texture_lr: 0.001
scale_factor: 1.0

reg_decay_iter: ${s2_iterations}
lambda_sdf: [0.2, 0.1]
lambda_flex: [0.5, 0.1]
lambda_inv_depth: 0.0
lambda_tv_depth: 0.0
lambda_normal_consistent: 0.0

# stage-3: fine-tune
s3_gs_per_face: 6
simplify_nface: 100000
init_opacity: 0.1
vert_lr: 0.0001
vert_lr_final: null
position_lr_final: 0.0000016
feature_lr: 0.0025
opacity_lr: 0.01
scaling_lr: 0.005
rotation_lr: 0.005
reset_opacity_steps: [500, 1500, 2500]
lambda_laplace_s3: 0.0
lambda_normal_consistent_s3: 0.001